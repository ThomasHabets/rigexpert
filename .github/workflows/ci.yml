name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: apt update
      run: sudo apt update
    - name: apt install
      run: sudo apt install build-essential pkg-config libdbus-1-dev
    - name: Install rust nightly
      run: rustup install nightly
    - name: Rustup install nightly clippy
      run: rustup component add --toolchain nightly clippy
    - name: Cargo install
      run: cargo install --locked tickbox cargo-deny
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: CLEANUP=true tickbox --dir tickbox/pre-commit --disable-tui
